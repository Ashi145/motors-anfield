<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range Rover — Anfield Motors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --asphalt:#14161A;
      --panel:#242932;
      --amber:#F2A63D;
      --paper:#EDE7DA;
      --chalk:#9BA6AE;
      --line: rgba(237,231,218,0.09);
      --radius: 2px;
      --display: 'Bebas Neue', 'Arial Narrow', sans-serif;
      --body: 'Work Sans', -apple-system, Segoe UI, sans-serif;
    }
    *,*::before,*::after{ box-sizing:border-box; }
    body{ margin:0; background:var(--asphalt); color:var(--paper); font-family:var(--body); -webkit-font-smoothing:antialiased; }
    .container{ max-width:900px; margin:0 auto; padding:40px 24px; }
    .back-btn{
      display:inline-flex; align-items:center; gap:8px; color:var(--amber); font-size:14px;
      font-weight:600; text-decoration:none; margin-bottom:40px; text-transform:uppercase;
      letter-spacing:0.06em;
    }
    .back-btn:hover{ opacity:0.8; }
    .back-btn svg{ width:18px; height:18px; }
    h1{ font-family:var(--display); font-size:clamp(40px,6vw,64px); margin:0 0 12px; letter-spacing:0.02em; }
    .subtitle{ color:var(--chalk); font-size:16px; margin-bottom:30px; }
    .car-image{
      width:100%; max-height:500px; object-fit:cover; border-radius:var(--radius);
      border:1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anfield Motors
    </a>
    <h1>RANGE ROVER</h1>
    <p class="subtitle">Land Rover group — Specialist care at Anfield Motors</p>
    <img src="cars1.jpeg" alt="Range Rover" class="car-image">
  </div>
</body>
</html>
