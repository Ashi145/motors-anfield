<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Anfield Motors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --asphalt:#14161A;
      --gunmetal:#1D2129;
      --panel:#242932;
      --amber:#F2A63D;
      --steel:#5C6B78;
      --paper:#EDE7DA;
      --chalk:#9BA6AE;
      --line: rgba(237,231,218,0.09);
      --radius: 2px;
      --display: 'Bebas Neue', 'Arial Narrow', sans-serif;
      --body: 'Work Sans', -apple-system, Segoe UI, sans-serif;
    }
    *,*::before,*::after{ box-sizing:border-box; }
    body{ margin:0; background:var(--asphalt); color:var(--paper); font-family:var(--body); -webkit-font-smoothing:antialiased; }
    .container{ max-width:1100px; margin:0 auto; padding:40px 24px; }
    .back-btn{
      display:inline-flex; align-items:center; gap:8px; color:var(--amber); font-size:14px;
      font-weight:600; text-decoration:none; margin-bottom:40px; text-transform:uppercase;
      letter-spacing:0.06em;
    }
    .back-btn:hover{ opacity:0.8; }
    .back-btn svg{ width:18px; height:18px; }
    h1{ font-family:var(--display); font-size:clamp(40px,6vw,64px); margin:0 0 12px; letter-spacing:0.02em; }
    .subtitle{ color:var(--chalk); font-size:16px; margin-bottom:40px; }
    h2{ font-family:var(--display); font-size:28px; margin:0 0 20px; letter-spacing:0.02em; color:var(--amber); }
    .gallery-grid{
      display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px;
      margin-bottom:60px;
    }
    .gallery-item{
      position:relative; overflow:hidden; border:1px solid var(--line); border-radius:var(--radius);
      cursor:pointer; transition:transform .2s ease;
    }
    .gallery-item:hover{ transform:translateY(-4px); }
    .gallery-item img{ width:100%; height:240px; object-fit:cover; display:block; }
    .gallery-item .label{
      position:absolute; bottom:0; left:0; right:0; padding:12px 16px;
      background:linear-gradient(transparent, rgba(20,22,26,0.9)); font-size:14px;
      font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
    }
    .placeholder{
      width:100%; height:240px; background:var(--gunmetal); border:1px solid var(--line);
      border-radius:var(--radius); display:flex; flex-direction:column; align-items:center;
      justify-content:center; color:var(--steel);
    }
    .placeholder svg{ width:48px; height:48px; margin-bottom:12px; opacity:0.4; }
    .placeholder p{ font-size:12px; text-transform:uppercase; letter-spacing:0.1em; }

    /* Lightbox */
    .lightbox{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1000;
      align-items:center; justify-content:center; padding:40px;
    }
    .lightbox.active{ display:flex; }
    .lightbox img{ max-width:90%; max-height:85vh; object-fit:contain; border-radius:var(--radius); }
    .lightbox-close{
      position:absolute; top:24px; right:24px; background:none; border:none; color:var(--paper);
      font-size:28px; cursor:pointer; width:44px; height:44px; display:flex; align-items:center;
      justify-content:center; border-radius:50%; transition:background .2s;
    }
    .lightbox-close:hover{ background:rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anfield Motors
    </a>
    <h1>GALLERY</h1>
    <p class="subtitle">Cars we've worked on and our workshop in Kireka.</p>

    <h2>Our Cars</h2>
    <div class="gallery-grid">
      <div class="gallery-item" onclick="openLightbox('cars.jpeg')">
        <img src="cars.jpeg" alt="BMW at Anfield Motors">
        <div class="label">BMW</div>
      </div>
      <div class="gallery-item" onclick="openLightbox('cars1.jpeg')">
        <img src="cars1.jpeg" alt="Range Rover at Anfield Motors">
        <div class="label">Range Rover</div>
      </div>
      <div class="gallery-item" onclick="openLightbox('totyota.jpeg')">
        <img src="totyota.jpeg" alt="Toyota at Anfield Motors">
        <div class="label">Toyota</div>
      </div>
    </div>

    <h2>Workshop</h2>
    <div class="gallery-grid">
      <div class="gallery-item">
        <div class="placeholder">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 15l5-5 4 4 4-6 5 7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <p>Workshop photo coming soon</p>
        </div>
      </div>
      <div class="gallery-item">
        <div class="placeholder">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 15l5-5 4 4 4-6 5 7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <p>Workshop photo coming soon</p>
        </div>
      </div>
      <div class="gallery-item">
        <div class="placeholder">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 15l5-5 4 4 4-6 5 7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <p>Workshop photo coming soon</p>
        </div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="" alt="Enlarged view">
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
